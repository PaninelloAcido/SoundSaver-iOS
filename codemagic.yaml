workflows:
  soundsaver-ios:
    name: SoundSaver - Unsigned compilation
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen and generate project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/xcode-version.log
          xcodegen --version | tee build/logs/xcodegen-version.log
          xcodegen generate --spec project.yml
          xcodebuild -list -project SoundSaver.xcodeproj
      - name: Compile simulator app and embedded extension without signing
        script: |
          set -euo pipefail
          xcodebuild build -project SoundSaver.xcodeproj -scheme SoundSaver \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/logs/xcodebuild.log
          test -d build/DerivedData/Build/Products/Debug-iphonesimulator/SoundSaver.app/PlugIns/SoundSaverShareExtension.appex
    artifacts:
      - build/logs/*.log
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  soundsaver-testflight:
    name: SoundSaver - TestFlight
    max_build_duration: 40
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic SoundSaver
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - soundsaver_distribution
        provisioning_profiles:
          - soundsaver_app_store
          - soundsaver_share_app_store
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          mkdir -p build/logs
          xcodebuild -version | tee build/logs/xcode-version.log
          xcodegen --version | tee build/logs/xcodegen-version.log
          xcodegen generate --spec project.yml
          # The app and extension inherit the same build number.
          agvtool new-version -all "$((BUILD_NUMBER + 1))"
      - name: Apply SoundSaver provisioning profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Archive and export signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa --project SoundSaver.xcodeproj --scheme SoundSaver \
            2>&1 | tee build/logs/signed-build.log
    artifacts:
      - build/ios/ipa/*.ipa
      - build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
